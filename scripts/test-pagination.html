<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Paginación Móvil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .pagination {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        button.active {
            background-color: #4CAF50;
            color: white;
        }
        .content {
            min-height: 2000px;
            background: linear-gradient(to bottom, #f0f0f0, #e0e0e0);
            padding: 20px;
            margin: 20px 0;
        }
        .info {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Test de Paginación Móvil</h1>
    
    <div class="info">
        <strong>Página actual:</strong> <span id="currentPage">1</span><br>
        <strong>URL:</strong> <span id="currentURL"></span>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="content">
        <h2>Contenido de la página <span id="pageContent">1</span></h2>
        <p>Haz scroll hacia abajo y luego vuelve arriba.</p>
        <p>La página NO debe cambiar al hacer scroll.</p>
        <p style="margin-top: 1500px;">Fin del contenido</p>
    </div>

    <div class="pagination" id="pagination2"></div>

    <script>
        // Obtener página de URL
        function getPageFromURL() {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page');
            return page ? parseInt(page, 10) : 1;
        }

        // Actualizar URL
        function updateURL(page) {
            const params = new URLSearchParams(window.location.search);
            params.set('page', page.toString());
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
            updateDisplay();
        }

        // Actualizar display
        function updateDisplay() {
            const currentPage = getPageFromURL();
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('pageContent').textContent = currentPage;
            document.getElementById('currentURL').textContent = window.location.href;
            
            // Actualizar botones
            renderPagination();
        }

        // Renderizar paginación
        function renderPagination() {
            const currentPage = getPageFromURL();
            const totalPages = 10;
            
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                html += `<button class="${activeClass}" onclick="changePage(${i})">Página ${i}</button>`;
            }
            
            document.getElementById('pagination').innerHTML = html;
            document.getElementById('pagination2').innerHTML = html;
        }

        // Cambiar página
        function changePage(page) {
            console.log('Cambiando a página:', page);
            updateURL(page);
        }

        // Detectar scroll (para debug)
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                console.log('Scroll detectado. Página actual:', getPageFromURL());
            }, 100);
        });

        // Inicializar
        updateDisplay();
        
        // Log cada segundo para detectar cambios
        setInterval(() => {
            const currentPage = getPageFromURL();
            console.log('Check periódico - Página:', currentPage);
        }, 2000);
    </script>
</body>
</html>
